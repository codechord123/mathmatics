<title>분수의 곱셈 수업 슬라이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#F4F6F3; --surface:#FFFFFF; --surface-2:#EAEFE9; --surface-3:#E1E8E0;
  --ink:#16211C; --ink-2:#3B4A42; --muted:#6C7A72;
  --rule:#DCE3DC; --rule-strong:#B4C0B7;
  --fa:#1B6C9E; --fa-soft:#D3E5F1;
  --fb:#A96F12; --fb-soft:#F6E6C4;
  --fc:#26775A; --fc-soft:#C7E2D5;
  --warn:#A8442F; --warn-soft:#F6E1DA;
  --stage-bg:#DDE3DC;
  --serif:'Gowun Batang','Nanum Myeongjo',serif;
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1411; --surface:#161D19; --surface-2:#1D2622; --surface-3:#25302B;
    --ink:#E6EDE7; --ink-2:#BECABF; --muted:#8A998F;
    --rule:#2A3530; --rule-strong:#3E4C45;
    --fa:#7CBBE2; --fa-soft:#1B3A4C;
    --fb:#E5B45F; --fb-soft:#463516;
    --fc:#6BC69A; --fc-soft:#1B3F30;
    --warn:#E58F77; --warn-soft:#3B241D;
    --stage-bg:#080B09;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1411; --surface:#161D19; --surface-2:#1D2622; --surface-3:#25302B;
  --ink:#E6EDE7; --ink-2:#BECABF; --muted:#8A998F;
  --rule:#2A3530; --rule-strong:#3E4C45;
  --fa:#7CBBE2; --fa-soft:#1B3A4C;
  --fb:#E5B45F; --fb-soft:#463516;
  --fc:#6BC69A; --fc-soft:#1B3F30;
  --warn:#E58F77; --warn-soft:#3B241D;
  --stage-bg:#080B09;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--stage-bg); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.6; overflow:hidden;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent}

/* ---------- stage ---------- */
#viewport{position:fixed; inset:0; overflow:hidden}
#stage{position:absolute; top:0; left:0; width:1600px; height:900px;
  transform-origin:top left; background:var(--paper)}
.slide{position:absolute; inset:0; display:none; padding:26px 36px 24px;
  grid-template-rows:46px auto minmax(0,1fr) auto; gap:14px; background:var(--paper)}
.slide.on{display:grid}

/* ---------- fractions ---------- */
.fr{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.02; margin:0 .12em}
.fr .n{font-size:.64em; padding:0 .22em}
.fr .d{font-size:.64em; padding:0 .22em; border-top:.075em solid currentColor; margin-top:.06em}
.mx{display:inline-flex; align-items:center; vertical-align:middle; gap:.1em; white-space:nowrap}
.eq{font-variant-numeric:tabular-nums; white-space:nowrap}
.eq .op{color:var(--muted); padding:0 .2em}

/* ---------- slide header ---------- */
.sl-head{display:flex; align-items:center; gap:14px; min-width:0}
.badge{font-family:var(--mono); font-size:19px; font-weight:600; letter-spacing:.04em;
  color:#fff; background:var(--ink); border-radius:8px; padding:5px 13px; white-space:nowrap}
.sl-head h2{font-family:var(--serif); font-weight:700; font-size:32px; margin:0; letter-spacing:-.01em; white-space:nowrap}
.pill{font-size:21px; font-weight:600; color:var(--fc); background:var(--fc-soft); border-radius:8px; padding:4px 15px; white-space:nowrap}
.sl-head .pages{font-family:var(--mono); font-size:17px; color:var(--muted); white-space:nowrap}

/* ---------- context slide : 그림이 주인공 ---------- */
.keyrow{display:flex; align-items:center; justify-content:space-between; gap:22px; flex-wrap:wrap}
.keyline{margin:0; font-size:36px; font-weight:600; line-height:1.28; color:var(--ink);
  display:flex; align-items:center; gap:14px}
.keyicon{font-size:44px; line-height:1; flex:0 0 auto}
.keyline .q{color:var(--fc)}
.eqbig{font-family:var(--serif); font-weight:700; font-size:52px; line-height:1.15; white-space:nowrap;
  background:var(--surface-2); border-radius:13px; padding:9px 24px; display:flex; align-items:center; gap:12px}
.eqbig .unit{font-size:36px}
.figbig{margin:0; position:relative; min-height:0; min-width:0}
.figbig .dg-canvas{position:absolute; inset:0}
.figbig svg{display:block; width:100%; height:100%}
.chips3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
.chip{display:flex; align-items:center; gap:14px; background:var(--surface);
  border:1.5px solid var(--rule); border-radius:13px; padding:13px 20px;
  font-size:27px; font-weight:600; line-height:1.24}
.chip .cn{width:38px; height:38px; border-radius:50%; background:var(--fc); color:#fff;
  font-family:var(--mono); font-size:18px; font-weight:600; display:grid; place-items:center; flex:0 0 auto}
.eqtail{display:inline-flex; align-items:center; gap:12px}

/* ---------- 단계별 등장 (build) ---------- */
.st{transition:opacity .34s ease}
.chip,.eqtail,.qans{transition:opacity .34s ease, transform .34s ease}
[data-st].pending{opacity:0}
.chip.pending{transform:translateY(14px)}
.eqtail.pending{transform:translateX(-10px)}
.qans.pending{transform:translateY(10px)}
@keyframes slidein{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
.slide.on{animation:slidein .3s ease both}
#stage.noanim .st,#stage.noanim .chip,#stage.noanim .eqtail,#stage.noanim .qans{transition:none}
#stage.noanim .slide.on{animation:none}

/* ---------- quiz slide ---------- */
.slide.quiz{grid-template-rows:46px auto minmax(0,1fr)}
.qhint{margin:0; font-size:25px; color:var(--muted)}
.qhint b{color:var(--fc); font-weight:700}
.qgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:24px; min-height:0}
.qcard{background:var(--surface); border:1.5px solid var(--rule); border-radius:18px;
  padding:24px 26px 26px; display:flex; flex-direction:column; gap:16px; min-height:0}
.qtop{display:flex; align-items:center; gap:12px}
.qn{width:44px; height:44px; border-radius:50%; background:var(--ink); color:#fff;
  font-family:var(--mono); font-size:21px; font-weight:600; display:grid; place-items:center; flex:0 0 auto}
.qmodel{font-size:18px; font-weight:600; color:var(--fc); background:var(--fc-soft); border-radius:7px; padding:3px 12px}
.qtext{margin:0; font-size:27px; line-height:1.5}
.qslot{border:2px dashed var(--rule-strong); border-radius:14px; padding:18px 22px;
  flex:1; min-height:132px; display:flex; flex-direction:column; justify-content:center}
.qlab{font-family:var(--mono); font-size:17px; letter-spacing:.14em; color:var(--muted);
  font-weight:600; margin-bottom:12px}
.qicon{font-size:30px; line-height:1}

/* 답 입력 (자연수 · 분자 · 분모) */
.fin{display:flex; align-items:center; gap:12px}
.fin input{font-family:var(--serif); font-weight:700; text-align:center; padding:0;
  border-radius:11px; border:2px solid var(--rule-strong); background:var(--paper); color:var(--ink)}
.fin input::-webkit-outer-spin-button,.fin input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
.fw{width:84px; height:72px; font-size:38px}
.ffr{display:flex; flex-direction:column; align-items:center; gap:5px}
.ffr input{width:78px; height:44px; font-size:27px}
.fbar{width:86px; height:3px; background:var(--ink-2); border-radius:2px}
.fu{font-size:25px; color:var(--ink-2); font-weight:600}
.fin input:focus{outline:none; border-color:var(--fc); box-shadow:0 0 0 4px var(--fc-soft)}
.qbtn{margin-top:16px; align-self:flex-start; font-family:var(--sans); font-size:21px; font-weight:600;
  padding:11px 26px; border-radius:12px; border:none; background:var(--fc); color:#fff; cursor:pointer}
.qbtn:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.qfb{margin-top:12px; font-size:20px; line-height:1.4; min-height:28px; color:var(--muted)}
.qcard.ok{border-color:var(--fc)}
.qcard.ok .qslot{border-style:solid; border-color:var(--fc); background:var(--fc-soft)}
.qcard.ok .qfb{color:var(--fc); font-weight:600}
.qcard.ok .qbtn{display:none}
.qcard.bad .qslot{border-color:var(--warn)}
.qcard.bad .qfb{color:var(--warn); font-weight:600}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.qdone{font-size:23px; font-weight:600; color:var(--fc)}
.qeq{font-size:24px; color:var(--ink-2); line-height:1.3; margin-top:4px}

/* ---------- intro slide ---------- */
.slide.intro{grid-template-rows:46px minmax(0,1fr)}
.intro-body{display:flex; flex-direction:column; justify-content:center; gap:44px; min-height:0}
.readbig{margin:0; font-size:46px; line-height:1.42; text-align:center; padding:0 30px}
.readbig b{font-weight:700; color:var(--fc)}
.trapbig{background:var(--warn-soft); border-radius:20px; padding:28px 36px; text-align:center}
.trapbig .lbl{font-family:var(--mono); font-size:20px; letter-spacing:.11em; color:var(--warn); font-weight:600}
.trapbig .line{font-size:42px; font-weight:700; margin-top:14px; line-height:1.4}
.trapbig .sub2{font-size:26px; color:var(--ink-2); margin-top:14px}
.mark-x{color:var(--warn); background:color-mix(in srgb,var(--warn) 14%,transparent); border-radius:8px; padding:2px 12px}
.mark-x::before{content:'✗ '}
.mark-o{color:var(--fc); background:color-mix(in srgb,var(--fc) 14%,transparent); border-radius:8px; padding:2px 12px}
.mark-o::before{content:'✓ '}
.arrow{color:var(--muted); padding:0 14px; font-weight:400}

/* ---------- cover & map ---------- */
.slide.cover{grid-template-rows:1fr auto; align-content:center; padding:80px 90px}
.cover-in{display:flex; flex-direction:column; justify-content:center}
.cover .eyebrow{font-family:var(--mono); font-size:24px; letter-spacing:.2em; color:var(--fc); font-weight:600}
.cover h1{font-family:var(--serif); font-weight:700; font-size:94px; line-height:1.1; margin:.2em 0 .18em; letter-spacing:-.02em}
.cover .lede{font-size:29px; color:var(--ink-2); max-width:34ch; margin:0; line-height:1.6}
.cover .facts{display:flex; gap:12px; margin-top:34px; flex-wrap:wrap}
.cover .facts span{font-family:var(--mono); font-size:20px; color:var(--muted);
  border:1px solid var(--rule-strong); border-radius:999px; padding:7px 18px; background:var(--surface)}
.cover .keys{display:flex; gap:26px; font-size:21px; color:var(--muted); align-items:center; flex-wrap:wrap}
.cover .keys kbd{font-family:var(--mono); font-size:18px; background:var(--surface); border:1px solid var(--rule-strong);
  border-bottom-width:3px; border-radius:7px; padding:3px 10px; margin-right:7px; color:var(--ink-2)}
.slide.map{grid-template-rows:46px minmax(0,1fr) auto}
.map-fig{margin:0; display:flex; align-items:center; justify-content:center; min-height:0}
.map-fig svg{width:100%; height:auto; max-height:100%}
.legend{display:flex; gap:48px; justify-content:center; font-size:24px; color:var(--ink-2); flex-wrap:wrap}
.legend div{display:flex; align-items:center; gap:12px}
.sw{width:24px; height:24px; border-radius:5px; border:2px solid var(--rule-strong)}
.sw.a{background:var(--fa-soft); border-color:var(--fa)}
.sw.b{background:var(--fb-soft); border-color:var(--fb)}
.sw.c{background:var(--fc-soft); border-color:var(--fc)}

/* ---------- deck chrome ---------- */
#bar{position:fixed; left:0; right:0; bottom:0; height:5px; background:rgba(128,140,132,.24); z-index:30}
#bar i{display:block; height:100%; background:var(--fc); transition:width .18s ease}
#chrome > *{transition:opacity .3s ease}
#chrome.hide > *{opacity:0; pointer-events:none}
.navbtn{position:fixed; top:50%; margin-top:-33px; z-index:32; width:66px; height:66px; border-radius:50%;
  border:1px solid rgba(128,140,132,.4); background:rgba(255,255,255,.78); color:#16211C;
  font-size:30px; line-height:1; cursor:pointer; display:grid; place-items:center;
  backdrop-filter:blur(6px)}
.navbtn:hover{background:#fff}
.navbtn:focus-visible{outline:3px solid var(--fc); outline-offset:3px}
.navbtn[disabled]{opacity:.2; cursor:default}
#prev{left:16px} #next{right:16px}
#tools{position:fixed; top:22px; right:26px; z-index:38; display:flex; gap:10px; align-items:center}
#tools button{font-family:var(--sans); font-size:17px; font-weight:500; padding:9px 16px; border-radius:10px;
  border:1px solid rgba(128,140,132,.4); background:rgba(255,255,255,.78); color:#16211C; cursor:pointer;
  backdrop-filter:blur(6px)}
#tools button:hover{background:#fff}
#tools button:focus-visible{outline:3px solid var(--fc); outline-offset:2px}
#tools button.act{background:var(--fc); color:#fff; border-color:var(--fc)}
#counter{font-family:var(--mono); font-size:17px; color:var(--ink-2); background:rgba(255,255,255,.72);
  border:1px solid rgba(128,140,132,.35); border-radius:999px; padding:8px 16px; backdrop-filter:blur(6px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .navbtn,
  :root:not([data-theme="light"]) #tools button,
  :root:not([data-theme="light"]) #counter{background:rgba(28,36,31,.84); color:#E6EDE7; border-color:rgba(150,165,155,.35)}
}
:root[data-theme="dark"] .navbtn,
:root[data-theme="dark"] #tools button,
:root[data-theme="dark"] #counter{background:rgba(28,36,31,.84); color:#E6EDE7; border-color:rgba(150,165,155,.35)}

/* ---------- presenter notes ---------- */
#notes{position:fixed; left:0; right:0; bottom:0; z-index:36; max-height:46vh; overflow-y:auto;
  background:#141C18; color:#E6EDE7; padding:20px 34px 34px; display:none;
  box-shadow:0 -14px 44px rgba(0,0,0,.4); border-top:3px solid var(--fc)}
#notes.on{display:block}
#notes .nh{font-family:var(--mono); font-size:14px; letter-spacing:.14em; color:#7FCBA5; font-weight:600; margin-bottom:12px}
#notes .nstory{font-size:20px; line-height:1.6; margin:0 0 16px; color:#F1F6F1}
#notes .ngrid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px}
#notes .nstep h4{margin:0 0 4px; font-size:16px; color:#9FE0BF; font-weight:600}
#notes .nstep p{margin:0; font-size:16px; line-height:1.55; color:#CFDBD3}
#notes .nstep .ncalc{display:block; margin-top:6px; font-size:17px; color:#F1F6F1}
#notes .ncap{margin:16px 0 0; font-size:16px; line-height:1.55; color:#A9B9AF; border-top:1px solid #2A3A32; padding-top:12px}
#notes .mark-x,#notes .mark-o{background:transparent; padding:0}
#notes .mark-x{color:#F0A08A} #notes .mark-o{color:#7FCBA5}

/* ---------- overview ---------- */
#ov{position:fixed; inset:0; z-index:40; background:var(--paper); overflow-y:auto; padding:34px 40px 60px; display:none}
#ov.on{display:block}
#ov h2{font-family:var(--serif); font-size:32px; margin:0 0 6px}
#ov .hint{margin:0 0 26px; color:var(--muted); font-size:17px}
.ovgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:14px}
.ovcard{text-align:left; cursor:pointer; padding:15px 17px; border-radius:13px; background:var(--surface);
  border:1.5px solid var(--rule); font-family:var(--sans); color:var(--ink); display:flex; flex-direction:column; gap:6px}
.ovcard:hover{border-color:var(--fc)}
.ovcard:focus-visible{outline:3px solid var(--fc); outline-offset:2px}
.ovcard.here{border-color:var(--fc); background:var(--fc-soft)}
.ovcard .k{font-family:var(--mono); font-size:13px; color:var(--muted); letter-spacing:.06em}
.ovcard .t{font-size:16px; font-weight:600; line-height:1.35}
.ovcard .e{font-size:18px; color:var(--ink-2)}
.ovsec{grid-column:1/-1; margin:20px 0 2px; font-family:var(--mono); font-size:14px; letter-spacing:.12em;
  color:var(--fc); font-weight:600}
.ovsec:first-child{margin-top:0}

/* ---------- diagram svg classes ---------- */
.dg-t{font-family:var(--sans); font-variant-numeric:tabular-nums}
.dg-m{font-family:var(--mono)}
.dg-ink{fill:var(--ink)} .dg-i2{fill:var(--ink-2)} .dg-mut{fill:var(--muted)}
.dg-fa{fill:var(--fa)} .dg-fb{fill:var(--fb)} .dg-fc{fill:var(--fc)} .dg-warn{fill:var(--warn)}
.dgs-ink{stroke:var(--ink);stroke-width:1.3;fill:none}
.dgs-i2{stroke:var(--ink-2);stroke-width:1.3;fill:none}
.dgs-mut{stroke:var(--rule-strong);stroke-width:1.2;fill:none}
.dgs-fa{stroke:var(--fa);stroke-width:1.6;fill:none}
.dgs-fb{stroke:var(--fb);stroke-width:1.6;fill:none}
.dgs-fc{stroke:var(--fc);stroke-width:1.8;fill:none}
.dg-frame{fill:none; stroke:var(--ink-2); stroke-width:1.6}
.dg-grid{stroke:var(--rule-strong); stroke-width:1; fill:none}
.dg-dash{stroke:var(--rule-strong); stroke-width:1.1; stroke-dasharray:4 4; fill:none}
.f-a{fill:var(--fa-soft)} .f-b{fill:var(--fb-soft)} .f-c{fill:var(--fc-soft)}
.f-n{fill:var(--surface-2)} .f-s{fill:var(--surface)} .f-none{fill:none}
.f-dot-a{fill:var(--fa)} .f-dot-b{fill:var(--fb)} .f-dot-c{fill:var(--fc)}
.s-rule{stroke:var(--rule-strong); stroke-width:1.2; fill:none}
.mk-fa{fill:var(--fa)} .mk-fb{fill:var(--fb)} .mk-fc{fill:var(--fc)} .mk-ink{fill:var(--ink-2)}

@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
@media print{
  @page{size:A4 landscape; margin:6mm}
  body{overflow:visible; background:#fff}
  #viewport{position:static; overflow:visible}
  #stage{position:static; transform:none!important; width:auto; height:auto}
  .slide{position:static; display:grid!important; width:1600px; height:900px;
    zoom:.62; break-after:page; border:1px solid #ddd}
  #bar,#chrome,#notes,#ov{display:none!important}
  [data-st].pending{opacity:1!important; transform:none!important}
}
</style>

<div id="viewport"><div id="stage"></div></div>
<div id="chrome">
  <button class="navbtn" id="prev" aria-label="이전 슬라이드">‹</button>
  <button class="navbtn" id="next" aria-label="다음 슬라이드">›</button>
  <div id="tools">
    <span id="counter" aria-live="polite">1 / 26</span>
    <button id="unlockbtn" aria-label="연습 문제 잠금 해제" style="display:none">잠금 해제</button>
    <button id="animbtn" aria-label="단계별 등장 켜기 끄기">단계별 등장</button>
    <button id="notebtn" aria-label="발표자 노트 열기">발표자 노트</button>
    <button id="ovbtn" aria-label="전체 슬라이드 보기">전체 보기</button>
    <button id="fsbtn" aria-label="전체 화면">전체 화면</button>
  </div>
</div>
<div id="bar"><i></i></div>
<div id="notes" role="region" aria-label="발표자 노트"></div>
<div id="ov" role="dialog" aria-label="전체 슬라이드">
  <h2>전체 슬라이드</h2>
  <p class="hint">칸을 누르면 그 화면으로 이동합니다. <b>Esc</b> 또는 <b>O</b> 키로 닫습니다.</p>
  <div class="ovgrid" id="ovgrid"></div>
</div>

<script>
(function(){
"use strict";

/* ============ inline markup ============ */
function frEl(n,d){
  var s=document.createElement('span'); s.className='fr';
  var a=document.createElement('span'); a.className='n'; a.textContent=n;
  var b=document.createElement('span'); b.className='d'; b.textContent=d;
  s.appendChild(a); s.appendChild(b); return s;
}
function mixEl(w,n,d){
  var s=document.createElement('span'); s.className='mx';
  var t=document.createElement('span'); t.textContent=w; s.appendChild(t);
  s.appendChild(frEl(n,d)); return s;
}
/* [3/4] 분수 · [1_3/4] 대분수 · *굵게* · {✗ …}{✓ …} 정오 · | 화살표 */
function md(str,host){
  host.textContent='';
  var re=/\[(\d+)_(\d+)\/(\d+)\]|\[(\d+)\/(\d+)\]|\*([^*]+)\*|\{([^}]+)\}|(\|)/g, last=0, m;
  while((m=re.exec(str))){
    if(m.index>last) host.appendChild(document.createTextNode(str.slice(last,m.index)));
    if(m[1]) host.appendChild(mixEl(m[1],m[2],m[3]));
    else if(m[4]) host.appendChild(frEl(m[4],m[5]));

  T(g,x+sp.n1*sp.n2*p3/2,rows[3]+h/2+5,(sp.n1*sp.n2)+'/'+D,{s:14,w:700,c:'dg-fc'});
  var rn=sp.n1*sp.n2, rd=D, q=gcd(rn,rd)||1;
  var ry=rows[3]+h+30;
  T(g,x,ry,'전체를 '+D+'칸으로 보면 '+rn+'칸',{a:'start',s:13,c:'dg-mut'});
  var bx=x+W-150;

  vDraw(g,bx+72,ry-6,{n:rn/q,d:rd/q},18,'dg-fc');
  return {w:720,h:ry+24};
};

/* ============ mount one diagram ============ */
function mountDG(host,sp){
  var fn=DG[sp.type]; if(!fn) return 0;
  var svg=S('svg',{role:'img','aria-label':sp.alt||''});
  var g=svg.appendChild(S('g',{}));
  var r, ms=0;
  try{ beginSteps(g); r=fn(g,sp); ms=maxStep(); }
  catch(e){ ROOT=null; return 0; }
  ROOT=null;
  r=r||{w:720,h:300};
  var VW=Math.max(720,Math.ceil(r.w)+14);
  g.setAttribute('transform','translate('+((VW-r.w)/2).toFixed(1)+',0)');
  svg.setAttribute('viewBox','0 0 '+VW+' '+Math.ceil(r.h));
  host.appendChild(svg);
  return ms;
}

var stage=document.getElementById('stage');
var nodes=[], MAXST=[], UNLOCK=[];

/* 맥락·문항마다 소재 아이콘 (등장 순서대로) */
var CTX_ICONS=['🥛','🎀','🚰','🍎','🪣','🚶','🎨','🧶','💰','⚖️','🔗','🔨','🌱','🍕','👓','🌷','🥤','🥾'];
var QUIZ_ICONS=[['🧃','🎀','🚰'],['🌾','🪣','🚶'],['🍬','🧶','💰'],
                ['⚖️','🔗','🔨'],['🌱','🍰','⚽'],['🌷','🥤','🥾']];
var ci=0, qi=0;

/* ---- 답 채점 : 동치분수는 모두 정답 ---- */
function parseAns(s){
  var m=/^(\d+)_(\d+)\/(\d+)$/.exec(s); if(m) return [(+m[1])*(+m[3])+(+m[2]), +m[3]];
  m=/^(\d+)\/(\d+)$/.exec(s); if(m) return [+m[1],+m[2]];
  return [+s,1];
}
function readCard(card){
  var v=card._inputs.map(function(x){ return x.value.replace(/\s/g,''); });
  var w=v[0], n=v[1], d=v[2];
  if(w===''&&n===''&&d==='') return null;
  if(/\D/.test(w+n+d)) return 'bad';
  if(n===''&&d==='') return [+w,1];
  if(n===''||d==='') return 'bad';
  var D=+d; if(D===0) return 'bad';
  return [(w===''?0:+w)*D+(+n), D];
}
function flag(card,msg){
  card.classList.add('bad');
  card._fb.textContent=msg;
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
}
function checkCard(card,slideIdx){
  if(card.classList.contains('ok')) return;
  var v=readCard(card), fb=card._fb;
  card.classList.remove('bad');
  if(v===null){ fb.textContent='답을 먼저 써 주세요.'; return; }
  if(v==='bad'){ flag(card,'숫자만 써 주세요. 분수는 분자와 분모를 모두 채웁니다.'); return; }
  var a=card._ans;
  if(v[0]*a[1]===a[0]*v[1]){
    card.classList.add('ok');
    card._inputs.forEach(function(x){ x.readOnly=true; });
    fb.textContent='';
    el('div','qdone',fb).textContent='정답입니다';
    var eqline=el('div','qeq',fb);
    eqline.appendChild(eqEl(card._eq));
    if(card._unit) el('span',null,eqline).textContent=' '+card._unit;
    if(slideIdx===cur) applyBuild();
  } else {
    card._tries++;
    flag(card, card._tries>=2 ? '다시 한 번 — 식을 세워 보세요.' : '다시 한 번 생각해 볼까요?');
    if(card._tries>=2) el('div','qeq',card._fb).appendChild(eqEl(card._eq.split(' = ')[0]));
  }
}
function quizSolved(i){
  var s=nodes[i]; if(!s) return true;
  var cards=s.querySelectorAll('.qcard');
  if(!cards.length) return true;
  return [].every.call(cards,function(c){ return c.classList.contains('ok'); });
}

function head(sl,slide){
  var h=el('header','sl-head',slide);
  if(sl.chasi){ el('span','badge',h).textContent=sl.chasi; }
  if(sl.title){ el('h2',null,h).textContent=sl.title; }
  if(sl.model){ el('span','pill',h).textContent=sl.model; }
  if(sl.pages){ el('span','pages',h).textContent=sl.pages; }
}

L.forEach(function(sl,i){
  var slide=el('section','slide '+(sl.k==='ctx'?'ctx':sl.k),stage);
  slide.id='s'+(i+1);
  slide.setAttribute('aria-hidden','true');

  if(sl.k==='cover'){
    var c=el('div','cover-in',slide);

    md('차시마다 *배 · 측정(수직선) · 비율* 세 가지 맥락을 한 화면씩. 화면은 그림과 키워드만 두고, 설명은 선생님 몫입니다.',el('p','lede',c));

    ['6개 차시','18개 상황맥락','연습 문제 18문항','그림 중심 32장'].forEach(function(x){
      el('span',null,f).textContent=x; });
    var kk=el('div','keys',slide);
    kk.innerHTML='<span><kbd>→</kbd>그림을 한 단계씩 쌓고, 다 쌓이면 다음 화면</span>'+
      '<span><kbd>N</kbd>발표자 노트</span><span><kbd>A</kbd>단계별 등장 끄기</span>'+

      '<span>연습 문제는 세 문제를 맞혀야 넘어갑니다 — 교사용 <kbd>Shift</kbd><kbd>→</kbd>로 건너뛰기</span>';
    nodes.push(slide); return;
  }

  if(sl.k==='map'){
    sl.chasi='개념 흐름'; sl.title='여섯 차시는 무엇이 달라지며 이어지는가';
    head(sl,slide);
    el('figure','map-fig',slide).innerHTML=MAP_SVG;
    var lg=el('div','legend',slide);
    [['a','첫째 인수 · 가로 방향'],['b','둘째 인수 · 세로 방향'],['c','겹친 부분 = 곱한 값']]
      .forEach(function(x){
        var d=el('div',null,lg); el('span','sw '+x[0],d);
        el('span',null,d).textContent=x[1]; });
    nodes.push(slide); return;
  }

  head(sl,slide);

  if(sl.k==='intro'){
    var ib=el('div','intro-body',slide);
    md(sl.read,el('p','readbig',ib));
    var tb=el('div','trapbig',ib);
    el('div','lbl',tb).textContent='자주 나오는 오답';
    md(sl.trapKey,el('div','line',tb));
    el('div','sub2',tb).textContent=sl.trapSub;
    nodes.push(slide); return;
  }

  if(sl.k==='quiz'){
    md('답을 써 보세요. *세 문제를 모두 맞히면* 다음 화면으로 넘어갑니다.',el('p','qhint',slide));
    var qg=el('div','qgrid',slide);
    var icons=QUIZ_ICONS[qi++]||[];
    sl.items.forEach(function(it,j){
      var card=el('div','qcard',qg);
      card._ans=parseAns(it.a);
      card._tries=0;
      var top=el('div','qtop',card);
      el('span','qn',top).textContent=String(j+1);
      if(icons[j]) el('span','qicon',top).textContent=icons[j];
      el('span','qmodel',top).textContent=it.model;
      md(it.q,el('p','qtext',card));

      var slot=el('div','qslot',card);
      el('div','qlab',slot).textContent='답';
      var fin=el('div','fin',slot);
      var wI=el('input','fw',fin);
      var fr=el('div','ffr',fin);
      var nI=el('input','fn',fr);
      el('span','fbar',fr);
      var dI=el('input','fd',fr);
      if(it.u) el('span','fu',fin).textContent=it.u;
      [[wI,'자연수 부분'],[nI,'분자'],[dI,'분모']].forEach(function(pair){
        pair[0].type='text'; pair[0].inputMode='numeric'; pair[0].autocomplete='off';
        pair[0].maxLength=6; pair[0].setAttribute('aria-label',pair[1]);
        pair[0].id='q'+i+'_'+j+'_'+pair[1];
      });
      card._inputs=[wI,nI,dI];

      var btn=el('button','qbtn',slot); btn.type='button'; btn.textContent='확인';
      var fb=el('div','qfb',slot);
      fb.textContent='자연수 칸 또는 분수 칸에 써 넣으세요.';
      card._fb=fb; card._eq=it.eq+' = '+it.a; card._unit=it.u||'';

      function check(){ checkCard(card,i); }
      btn.addEventListener('click',check);
      card._inputs.forEach(function(inp){
        inp.addEventListener('keydown',function(e){
          if(e.key==='Enter'){ e.preventDefault(); check(); }
          else if(e.key==='Escape'){ inp.blur(); }
        });
      });
    });
    MAXST[i]=0;
    nodes.push(slide); return;
  }

  /* ctx : 키워드 한 줄 + 식 + 큰 그림 + 키워드 칩 3개
     식은 "= 답" 부분을 마지막 단계까지 감춰 아이들이 답을 먼저 보지 않게 한다 */
  var kr=el('div','keyrow',slide);
  var kl=el('p','keyline',kr);
  var kic=CTX_ICONS[ci++];
  if(kic) el('span','keyicon',kl).textContent=kic;
  md(sl.key,el('span',null,kl));
  var eb=el('div','eqbig',kr);
  var seg=sl.eq.split(' = ');
  eb.appendChild(eqEl(seg[0]));
  var eqTail=null;
  if(seg.length>1){
    eqTail=el('span','eqtail',eb);
    eqTail.appendChild(eqEl('= '+seg.slice(1).join(' = ')));
    if(sl.unit) el('span','unit',eqTail).textContent=sl.unit;
  } else if(sl.unit){ el('span','unit',eb).textContent=sl.unit; }

  var fg=el('figure','figbig',slide);
  var dgSteps=mountDG(el('div','dg-canvas',fg),sl.dg);
  var mb=Math.max(dgSteps,3);
  if(eqTail) eqTail.setAttribute('data-st',String(mb));

  var c3=el('div','chips3',slide);
  sl.chips.forEach(function(t,j){
    var ch=el('div','chip',c3);
    ch.setAttribute('data-st',String(Math.min(j+1,mb)));
    el('span','cn',ch).textContent=String(j+1);
    md(t,el('span',null,ch));
  });
  MAXST[i]=mb;
  nodes.push(slide);
});

/* ============ presenter notes ============ */
var notesBox=document.getElementById('notes');
function renderNotes(i){
  var sl=L[i]; notesBox.textContent='';
  el('div','nh',notesBox).textContent='발표자 노트 — 화면에는 보이지 않습니다  ·  N 키로 닫기';
  if(sl.k==='ctx'){
    md('상황 — '+sl.story,el('p','nstory',notesBox));
    var g=el('div','ngrid',notesBox);
    sl.steps.forEach(function(st,j){
      var d=el('div','nstep',g);
      md((j+1)+'. '+st.h,el('h4',null,d));
      var p=el('p',null,d); md(st.p,el('span',null,p));
      if(st.c){ var cc=el('span','ncalc',p); cc.appendChild(eqEl(st.c)); }
    });
    md('그림 읽는 법 — '+sl.cap,el('p','ncap',notesBox));
  } else if(sl.k==='quiz'){
    md('연습 문제 풀이 — 답을 공개하기 전에 아이들 풀이를 먼저 말하게 하세요.',el('p','nstory',notesBox));
    var qg2=el('div','ngrid',notesBox);
    sl.items.forEach(function(it,j){
      var d=el('div','nstep',qg2);
      md((j+1)+'. '+it.model,el('h4',null,d));
      var p=el('p',null,d); md(it.sol,el('span',null,p));
      el('span','ncalc',p).appendChild(eqEl(it.eq+' = '+it.a+(it.u?' '+it.u:'')));
    });
  } else if(sl.k==='intro'){
    md(sl.sub,el('p','nstory',notesBox));
    md('지도 포인트 — '+sl.point,el('p','ncap',notesBox));
  } else {
    el('p','nstory',notesBox).textContent =
      sl.k==='cover' ? '← → 로 넘기고, 각 화면에서 N 키를 누르면 그 화면의 상황 전문과 단계별 설명이 여기에 나옵니다.'
                     : '세 갈래는 계산 절차가 아니라 “말로 읽는 방식”으로 나뉩니다. 아래 축(1보다 큰가 작은가)이 여섯 차시를 관통하는 판단 기준입니다.';
  }
}

/* ============ navigation ============ */
var cur=0, notesOn=false, bstep=0, anim=true;

/* 현재 화면에서 bstep 단계까지만 보이게 한다 */
function applyBuild(){
  var lim = anim ? bstep : 99;
  [].forEach.call(nodes[cur].querySelectorAll('[data-st]'),function(e){
    e.classList.toggle('pending', (+e.getAttribute('data-st')) > lim);
  });
  var m=MAXST[cur]||0, dots='';
  var isQuiz=(L[cur].k==='quiz');
  if(isQuiz){
    dots=[].map.call(nodes[cur].querySelectorAll('.qcard'),function(c){
      return c.classList.contains('ok')?'✓':'○'; }).join('');
  } else if(anim && m>0){ for(var i=1;i<=m;i++) dots += (i<=bstep?'●':'○'); }
  document.getElementById('counter').textContent=(cur+1)+' / '+L.length+(dots?'   '+dots:'');
  document.getElementById('prev').disabled=(cur===0 && bstep===0);
  var locked=isQuiz && !quizSolved(cur) && !UNLOCK[cur];
  document.getElementById('next').disabled=locked || (cur===L.length-1 && (!anim || bstep>=m));
  var ub=document.getElementById('unlockbtn');
  ub.style.display=isQuiz?'':'none';
  ub.classList.toggle('act',!!UNLOCK[cur]);
}
function show(i,push,atEnd){
  i=Math.max(0,Math.min(L.length-1,i));
  if(nodes[cur]){ nodes[cur].classList.remove('on'); nodes[cur].setAttribute('aria-hidden','true'); }
  cur=i;
  nodes[cur].classList.add('on'); nodes[cur].setAttribute('aria-hidden','false');
  bstep = atEnd ? (MAXST[i]||0) : 0;
  applyBuild();
  document.querySelector('#bar i').style.width=((i+1)/L.length*100)+'%';
  if(notesOn) renderNotes(i);
  if(push!==false){ try{ history.replaceState(null,'','#s'+(i+1)); }catch(e){} }
  [].forEach.call(document.querySelectorAll('.ovcard'),function(c,j){ c.classList.toggle('here',j===i); });
}
function go(d){
  var m=MAXST[cur]||0;
  if(d>0 && L[cur].k==='quiz' && !quizSolved(cur) && !UNLOCK[cur]){
    var cards=nodes[cur].querySelectorAll('.qcard');
    for(var k=0;k<cards.length;k++){
      if(!cards[k].classList.contains('ok')){
        flag(cards[k],'이 문제를 맞혀야 다음 화면으로 넘어갑니다.');
        try{ cards[k]._inputs[0].focus(); }catch(e){}
        break;
      }
    }
    return;
  }
  if(!anim){ if(cur+d>=0 && cur+d<L.length) show(cur+d); return; }
  if(d>0){
    if(bstep<m){ bstep++; applyBuild(); return; }
    if(cur<L.length-1) show(cur+1);
  } else {
    if(bstep>0){ bstep--; applyBuild(); return; }
    if(cur>0) show(cur-1,true,true);
  }
}
function setAnim(on){
  anim=on;
  stage.classList.toggle('noanim',!on);
  document.getElementById('animbtn').classList.toggle('act',on);
  bstep = on ? 0 : (MAXST[cur]||0);
  applyBuild();
  try{ localStorage.setItem('fmAnim',on?'1':'0'); }catch(e){}
}
function toggleNotes(on){
  notesOn=on;
  notesBox.classList.toggle('on',on);
  document.getElementById('notebtn').classList.toggle('act',on);
  if(on) renderNotes(cur);
}

document.getElementById('prev').addEventListener('click',function(){go(-1);});
document.getElementById('next').addEventListener('click',function(){go(1);});
document.getElementById('notebtn').addEventListener('click',function(){ toggleNotes(!notesOn); });
document.getElementById('animbtn').addEventListener('click',function(){ setAnim(!anim); });
document.getElementById('unlockbtn').addEventListener('click',function(){
  UNLOCK[cur]=!UNLOCK[cur]; applyBuild();
});

var LESSON_START=[2,7,12,17,22,27];

document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  /* 답을 입력하는 중에는 화면을 넘기지 않는다 */
  var t=e.target;
  if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA')){
    if(e.key==='Escape') t.blur();
    return;
  }
  /* 교사용 : Shift + → 는 잠긴 연습 문제를 건너뛴다 */
  if(e.shiftKey && e.key==='ArrowRight'){ UNLOCK[cur]=true; applyBuild(); go(1); e.preventDefault(); return; }
  var ovOn=document.getElementById('ov').classList.contains('on');
  if(e.key==='Escape'){ if(ovOn) toggleOv(false); else if(notesOn) toggleNotes(false); else return; e.preventDefault(); return; }
  if(e.key==='o'||e.key==='O'){ toggleOv(!ovOn); e.preventDefault(); return; }
  if(e.key==='n'||e.key==='N'){ toggleNotes(!notesOn); e.preventDefault(); return; }
  if(e.key==='a'||e.key==='A'){ setAnim(!anim); e.preventDefault(); return; }
  if(ovOn) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '||e.key==='Enter'){ go(1); e.preventDefault(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'||e.key==='Backspace'){ go(-1); e.preventDefault(); }
  else if(e.key==='Home'){ show(0); e.preventDefault(); }
  else if(e.key==='End'){ show(L.length-1); e.preventDefault(); }
  else if(/^[1-6]$/.test(e.key)){ show(LESSON_START[+e.key-1]); e.preventDefault(); }
});

/* swipe */
var sx=null,sy=null;
var vp=document.getElementById('viewport');
vp.addEventListener('pointerdown',function(e){
  /* 문제 카드 위에서는 스와이프로 넘기지 않는다 (입력·버튼 조작과 충돌) */
  if(e.target && e.target.closest && e.target.closest('.qcard')){ sx=null; return; }
  sx=e.clientX; sy=e.clientY;
});
vp.addEventListener('pointerup',function(e){
  if(sx===null) return;
  var dx=e.clientX-sx, dy=e.clientY-sy;
  if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.6) go(dx<0?1:-1);
  sx=null;
});

/* ============ overview ============ */
var ovgrid=document.getElementById('ovgrid');
var lastSec=null;
L.forEach(function(sl,i){
  var sec = sl.k==='cover'?'표지' : sl.k==='map'?'개념 흐름' : sl.chasi;
  if(sec!==lastSec){ el('div','ovsec',ovgrid).textContent=sec; lastSec=sec; }
  var b=el('button','ovcard',ovgrid); b.type='button';
  el('span','k',b).textContent=(i+1)+(sl.k==='ctx'?' · '+sl.model:sl.k==='intro'?' · 읽는 법':'');
  var t=el('span','t',b);
  if(sl.k==='cover') t.textContent='분수의 곱셈 상황맥락 지도';
  else if(sl.k==='map') t.textContent='여섯 차시는 무엇이 달라지며 이어지는가';
  else if(sl.k==='intro') t.textContent=sl.title+' — 읽는 법과 오답';
  else if(sl.k==='quiz') t.textContent='연습 문제 3문항 — 묶음 · 측정 · 비율';
  else md(sl.key,t);
  if(sl.k==='ctx'){ el('span','e',b).appendChild(eqEl(sl.eq.split(' = ')[0])); }
  b.addEventListener('click',function(){ toggleOv(false); show(i); });
});
function toggleOv(on){
  document.getElementById('ov').classList.toggle('on',on);
  if(on) document.querySelectorAll('.ovcard')[cur].focus();
}
document.getElementById('ovbtn').addEventListener('click',function(){
  toggleOv(!document.getElementById('ov').classList.contains('on'));
});

/* ============ fullscreen ============ */
var fsbtn=document.getElementById('fsbtn');
if(!document.documentElement.requestFullscreen) fsbtn.style.display='none';
else fsbtn.addEventListener('click',function(){
  try{
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }catch(e){}
});

/* ============ 조작 버튼 자동 숨김 (수업 중 화면을 가리지 않도록) ============ */
var chromeBox=document.getElementById('chrome'), hideT=null;
function ovIsOn(){ return document.getElementById('ov').classList.contains('on'); }
function poke(){
  chromeBox.classList.remove('hide');
  clearTimeout(hideT);
  hideT=setTimeout(function(){
    if(!notesOn && !ovIsOn()) chromeBox.classList.add('hide');
  },2800);
}
['pointermove','pointerdown','keydown'].forEach(function(ev){
  document.addEventListener(ev,poke,{passive:true});
});
poke();

/* ============ stage scaling ============ */
function fit(){
  var w=window.innerWidth, h=window.innerHeight;
  var s=Math.min(w/1600,h/900);
  stage.style.transform='translate('+((w-1600*s)/2)+'px,'+((h-900*s)/2)+'px) scale('+s+')';
}
window.addEventListener('resize',fit);
fit();

/* 애니메이션 기본값 : 저장된 설정 > 시스템의 "동작 줄이기" 설정 */
var animInit=true;
try{
  var saved=localStorage.getItem('fmAnim');
  if(saved!==null) animInit=(saved==='1');
  else if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) animInit=false;
}catch(e){}
anim=animInit;
stage.classList.toggle('noanim',!anim);
document.getElementById('animbtn').classList.toggle('act',anim);

var hm=/^#s(\d+)$/.exec(location.hash);
show(hm? (+hm[1]-1) : 0, false);

try{
  if(window.claude && window.claude.hot){
    window.claude.hot.snapshot(function(){ return {i:cur,n:notesOn,b:bstep,a:anim}; });
    if(window.claude.hot.ready) window.claude.hot.ready(function(d){
      if(d&&typeof d.a==='boolean') setAnim(d.a);
      if(d&&typeof d.i==='number') show(d.i);
      if(d&&typeof d.b==='number'){ bstep=d.b; applyBuild(); }
      if(d&&d.n) toggleNotes(true);
    });
  }
}catch(e){}
})();
</script>
